name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FLUTTER_VERSION_OLDEST: "3.7.12" # 2.0.6 but there is no image for that
  FLUTTER_VERSION_NEWEST: "3.38.9"

jobs:
  test:
    name: Test (newest Flutter version)
    runs-on: self-hosted

    container:
      image: ghcr.io/cirruslabs/flutter:${{ env.FLUTTER_VERSION_NEWEST }}

    steps:
      - uses: https://codeberg.org/Tienisto/checkout@v0.1.0

      - name: Dependencies
        run: dart pub get

      - name: Check format
        run: dart format --set-exit-if-changed lib bin test

      - name: Test
        run: dart test

  test_legacy:
    name: Test (oldest Flutter version)
    runs-on: self-hosted

    container:
      image: ghcr.io/cirruslabs/flutter:${{ env.FLUTTER_VERSION_OLDEST }}

    steps:
      - uses: https://codeberg.org/Tienisto/checkout@v0.1.0

      - name: Dependencies
        run: dart pub get

      - name: Test
        run: dart test
